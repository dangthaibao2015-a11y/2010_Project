<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9 lời chúc 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-a: #ffdfe8;
  --bg-b: #fff6f1;
  --ink: #4b1631;
  --muted: #8c5a6d;
  --rose: #c81f59;
  --chip: #ffffff;
  --chip-line: #f0c0d0;
  --paper: #fffaf1;
  --pt: #5a2a40;
  --env-back: #c42c5c;
  --env-front: #ee5f8e;
  --env-flap: #fb7ea5;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-a: #2d0f33;
    --bg-b: #170820;
    --ink: #ffe8f0;
    --muted: #d9a9c0;
    --rose: #ff7aa8;
    --chip: #331338;
    --chip-line: #5f2a63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-a: #2d0f33;
  --bg-b: #170820;
  --ink: #ffe8f0;
  --muted: #d9a9c0;
  --rose: #ff7aa8;
  --chip: #331338;
  --chip-line: #5f2a63;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html {
  height: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background: linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 100%);
}
body {
  height: 100%;
  margin: 0;
  position: relative;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.35), transparent 62%);
  color: var(--ink);
  font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg-a);
  z-index: 30;
}
button { font: inherit; }
button:focus-visible, .env:focus-visible, .dot:focus-visible {
  outline: 3px solid var(--rose);
  outline-offset: 3px;
}

/* ================= Phong bì ================= */
.intro {
  position: absolute; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px;
  transition: opacity .9s ease, visibility .9s;
}
.intro.leave { opacity: 0; visibility: hidden; pointer-events: none; }
.env {
  position: relative;
  width: min(86vw, 440px);
  aspect-ratio: 3 / 2;
  perspective: 1100px;
  margin-top: calc(min(86vw, 440px) * .3);
  cursor: pointer;
  border-radius: 6px;
}
.env-back {
  position: absolute; inset: 0; border-radius: 6px;
  background: var(--env-back);
  box-shadow: 0 26px 50px rgba(120, 10, 60, .28);
}
.letter {
  position: absolute; left: 6%; right: 6%; top: 7%; height: 90%;
  z-index: 2; border-radius: 5px;
  background: #fffaf1;
  padding: 9% 8% 0; text-align: center;
  box-shadow: 0 2px 10px rgba(80, 10, 40, .18);
  transition: transform 1.1s cubic-bezier(.22,.9,.25,1) .55s;
}
.env.open .letter { transform: translateY(-58%); }
.lt1 {
  margin: 0;
  font-family: "Dancing Script", "Brush Script MT", cursive;
  font-weight: 700; color: #c81f59;
  font-size: clamp(24px, 6.4vw, 34px); line-height: 1.25;
}
.lt2 { margin: 12px 0 0; color: #8d3a5d; font-size: clamp(13px, 3.4vw, 15px); opacity: 0; transition: opacity .8s ease; }
.env.open .lt2 { opacity: 1; transition-delay: 3.5s; }
.lw {
  display: inline-block; opacity: 0; filter: blur(5px);
  transition: opacity .2s, filter .2s;
}
.env.open .lw {
  opacity: 1; filter: none;
  transition: opacity .7s ease calc(1.7s + var(--i) * .22s), filter .7s ease calc(1.7s + var(--i) * .22s);
}
.pocket {
  position: absolute; inset: 0; z-index: 3; pointer-events: none;
  filter: drop-shadow(0 -2px 3px rgba(90, 0, 45, .28));
}
.pocket i {
  display: block; width: 100%; height: 100%; border-radius: 6px;
  background: linear-gradient(160deg, var(--env-front), #d94777);
  clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
}
.flap {
  position: absolute; left: 0; right: 0; top: 0; height: 54%;
  z-index: 4; transform-origin: 50% 0; pointer-events: none;
  transition: transform .85s cubic-bezier(.5,0,.2,1), z-index 0s .42s;
  filter: drop-shadow(0 4px 4px rgba(90, 0, 45, .25));
}
.flap i {
  display: block; width: 100%; height: 100%;
  background: linear-gradient(180deg, var(--env-flap), #f0648f);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.env.open .flap { transform: rotateX(180deg); z-index: 1; }
.seal {
  position: absolute; left: 50%; top: 54%; z-index: 5;
  width: 15%; aspect-ratio: 1; border-radius: 50%;
  transform: translate(-50%, -50%);
  display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #ff5f89, #ae1040);
  box-shadow: 0 3px 8px rgba(80, 0, 30, .4), inset 0 -2px 4px rgba(0,0,0,.2);
  transition: opacity .3s, transform .4s;
}
.seal svg { width: 52%; fill: #ffd9e4; }
.env.open .seal { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
.env:not(.open) { animation: nudge 2.8s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.intro-foot { position: relative; min-height: 50px; width: 100%; display: grid; place-items: center; }
.intro-foot > * { grid-area: 1 / 1; }
.hint { margin: 0; color: var(--muted); font-size: 15px; transition: opacity .4s; }
.hint.gone { display: none; }
.cta {
  border: 0; cursor: pointer; padding: 13px 28px; border-radius: 999px;
  background: #c81f59; color: #fff; font-weight: 500; font-size: 16px;
  box-shadow: 0 10px 24px rgba(200, 31, 89, .35);
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity .7s ease, transform .7s ease;
}
.cta.show { opacity: 1; transform: none; pointer-events: auto; }

/* ================= Ứng dụng / Sách ================= */
.app {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  opacity: 0; visibility: hidden; transition: opacity 1s ease .3s;
}
.app.show { opacity: 1; visibility: visible; }
.stage {
  position: relative; flex: 1; min-height: 0;
  display: grid; place-items: center; padding: 14px 12px 2px;
}
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

.book {
  --pw: 360px; --ph: 500px; --s: 1;
  position: relative; perspective: 2600px;
  transition: transform 1.1s cubic-bezier(.45,.05,.25,1);
}
.book.spread.closed { transform: translateX(calc(var(--pw) * -.5)); }
.book::before {
  content: ""; position: absolute; left: 3%; right: 3%; bottom: -22px; height: 30px;
  background: radial-gradient(ellipse at center, rgba(70, 10, 40, .4), transparent 70%);
  filter: blur(7px); z-index: -1;
}
.board {
  position: absolute; top: -9px; bottom: -9px; z-index: 0; border-radius: 10px;
  background: linear-gradient(135deg, #b3195a, #8c0e45);
  box-shadow: 0 18px 40px rgba(60, 10, 40, .32);
  transition: opacity .6s ease;
}
.board.l { left: -9px; width: calc(50% + 9px); }
.board.r { left: 50%; right: -9px; }
.book.spread.closed .board.l { opacity: 0; }
.book.single .board.l { display: none; }
.book.single .board.r { left: -9px; }

.leaf {
  position: absolute; top: 0; left: 50%; width: 50%; height: 100%;
  transform-origin: left center; transform-style: preserve-3d;
  transition: transform 1.1s cubic-bezier(.45,.05,.25,1);
}
.leaf.flipped { transform: rotateY(-180deg); }
.book.single .leaf { left: 0; width: 100%; transition: transform .95s cubic-bezier(.45,.05,.25,1), opacity .15s linear; }
.book.single .leaf.flipped { opacity: 0; pointer-events: none; transition: transform .95s cubic-bezier(.45,.05,.25,1), opacity .25s linear .7s; }
.notrans, .notrans * { transition: none !important; }

.face {
  position: absolute; inset: 0; overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.face.front { border-radius: 3px 9px 9px 3px; }
.face.back { transform: rotateY(180deg); border-radius: 9px 3px 3px 9px; }
.face::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 9;
  background: linear-gradient(to right, rgba(60, 10, 30, 0), rgba(60, 10, 30, .38));
}
.face.back::after { background: linear-gradient(to left, rgba(60, 10, 30, 0), rgba(60, 10, 30, .38)); }
.leaf.turning .face::after { animation: shade 1.1s ease; }
@keyframes shade { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

/* Bìa */
.cover {
  cursor: pointer; color: #fff3e0;
  background: linear-gradient(135deg, #cf2262 0%, #a3124c 60%, #8c0e45 100%);
}
.cover::before {
  content: ""; position: absolute; inset: 14px; border: 1px solid rgba(246, 211, 138, .65); border-radius: 5px;
}
.cv-flower { position: absolute; width: 135%; left: -17%; bottom: -24%; opacity: .5; }
.cv-in {
  position: absolute; inset: 0; padding: calc(40px * var(--s)) calc(28px * var(--s));
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.cv-small { margin: 0; font-size: calc(14px * var(--s)); color: #f6d38a; letter-spacing: .02em; }
.cv-title {
  margin: calc(18px * var(--s)) 0 0;
  font-family: "Dancing Script", "Brush Script MT", cursive; font-weight: 700;
  font-size: calc(62px * var(--s)); line-height: 1.02;
  text-shadow: 0 3px 14px rgba(60, 0, 30, .35);
}
.cv-sub { margin: calc(18px * var(--s)) 0 0; font-size: calc(14px * var(--s)); line-height: 1.6; color: #ffd9e5; max-width: 16em; }
.cv-hint {
  margin: auto 0 0; font-size: calc(13px * var(--s)); color: #f6d38a;
  animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe { 50% { opacity: .35; } }

/* Trang chữ */
.textpage { background: var(--paper); color: var(--pt); cursor: pointer; }
.textpage::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 10%; z-index: 3; pointer-events: none;
  background: linear-gradient(to right, rgba(110, 60, 40, .24), rgba(110, 60, 40, 0));
}
.frame {
  position: absolute; inset: 12px 12px 12px 20px; border: 1px solid rgba(200, 31, 89, .17);
  border-radius: 4px; pointer-events: none;
}
.tp-in {
  position: absolute; z-index: 2; overflow: hidden;
  left: calc(38px * var(--s)); right: calc(30px * var(--s)); bottom: calc(26px * var(--s));
  top: calc(var(--sh, 0px) + 28px * var(--s));
  display: flex; flex-direction: column;
}
.tp-title {
  margin: 0; font-family: "Dancing Script", "Brush Script MT", cursive; font-weight: 700;
  color: var(--rose-p, #c81f59); line-height: 1.1;
  font-size: calc(62px * var(--s) * var(--k, 1));
}
.tp-title span { display: inline-block; padding-right: .15em; clip-path: inset(-30% 100% -30% -5%); }
.textpage.on .tp-title span {
  clip-path: inset(-30% -10% -30% -5%);
  transition: clip-path 1.2s cubic-bezier(.5,0,.2,1) .5s;
}
.tp-sub {
  margin: calc(4px * var(--s)) 0 0; font-weight: 500; color: #8d3a5d;
  font-size: calc(16px * var(--s) * var(--k, 1));
  opacity: 0; transform: translateY(6px);
}
.tp-rule {
  display: block; width: calc(40px * var(--s)); height: 2px; border-radius: 2px;
  margin: calc(14px * var(--s)) 0; background: #c81f59; opacity: 0;
}
.textpage.on .tp-sub { opacity: 1; transform: none; transition: opacity .7s ease 1.35s, transform .7s ease 1.35s; }
.textpage.on .tp-rule { opacity: .5; transition: opacity .7s ease 1.45s; }
.tp-body, .tp-promise { margin: 0; }
.tp-body { font-size: calc(16.5px * var(--s) * var(--k, 1)); line-height: 1.78; }
.w, .pw {
  display: inline-block; opacity: 0; filter: blur(4px); transform: translateY(3px);
}
.textpage.on .w {
  opacity: 1; filter: none; transform: none;
  transition: opacity .6s ease calc(1.55s + var(--i) * 38ms), filter .6s ease calc(1.55s + var(--i) * 38ms), transform .6s ease calc(1.55s + var(--i) * 38ms);
}
.tp-promise {
  margin-top: calc(14px * var(--s)); text-align: center;
  font-family: "Dancing Script", "Brush Script MT", cursive; font-weight: 700;
  color: #c81f59; line-height: 1.22;
  font-size: calc(31px * var(--s) * var(--k, 1));
}
.textpage.on .pw {
  opacity: 1; filter: none; transform: none;
  transition: opacity .9s ease calc(var(--pd) + var(--i) * 140ms), filter .9s ease calc(var(--pd) + var(--i) * 140ms), transform .9s ease calc(var(--pd) + var(--i) * 140ms);
}
.final .tp-body { font-size: calc(15.5px * var(--s) * var(--k, 1)); line-height: 1.68; }
.tp-foot {
  margin-top: auto; padding-top: calc(10px * var(--s));
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: calc(12.5px * var(--s)); color: #a47488;
}
.restart {
  border: 1px solid rgba(200, 31, 89, .35); background: transparent; color: #c81f59;
  border-radius: 999px; padding: 5px 13px; cursor: pointer; font-size: calc(12.5px * var(--s)); font-weight: 500;
}
.restart:hover { background: rgba(200, 31, 89, .08); }

/* Trang tranh */
.scenepage { background: #f6dfe4; cursor: pointer; }
.scenepage::before {
  content: ""; position: absolute; inset: 0 0 0 auto; width: 11%; z-index: 3; pointer-events: none;
  background: linear-gradient(to left, rgba(60, 10, 30, .3), rgba(60, 10, 30, 0));
}
.face canvas { display: block; width: 100%; height: 100%; }
.sp-scene {
  position: absolute; z-index: 1; left: 10px; right: 10px; top: 10px;
  height: calc(var(--sh) - 10px); border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(80, 10, 40, .2);
}
.blank { background: var(--paper); }
.blank::before {
  content: ""; position: absolute; inset: 0 0 0 auto; width: 11%;
  background: linear-gradient(to left, rgba(110, 60, 40, .24), rgba(110, 60, 40, 0));
}

/* Thanh điều khiển */
.bar { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px 12px 16px; }
.nb {
  flex: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; color: var(--ink);
  background: var(--chip); border: 1px solid var(--chip-line);
}
.nb:disabled { opacity: .3; cursor: default; }
.nb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.mid { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.dots { display: flex; }
.dot { position: relative; width: 17px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer; }
.dot::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
  border-radius: 50%; background: var(--chip-line); transition: transform .3s, background .3s;
}
.dot.vis::before { background: var(--rose); opacity: .5; }
.dot.cur::before { background: var(--rose); opacity: 1; transform: scale(1.5); }
.label { font-size: 13px; color: var(--muted); min-height: 18px; text-align: center; }
@media (max-width: 480px) { .dot { width: 13px; } .bar { gap: 8px; } }

@media (prefers-reduced-motion: reduce) {
  .leaf, .book, .book.single .leaf { transition-duration: .01s !important; }
  .env:not(.open), .cv-hint { animation: none; }
  .w, .pw, .lw, .tp-title span, .tp-sub, .tp-rule, .lt2 { transition: none !important; }
  .textpage.on .tp-title span, .textpage.on .w, .textpage.on .pw, .textpage.on .tp-sub { transition: none !important; }
}

.author {
    display: inline-block;
    position: relative;
    margin: 24px 0;
    padding: 0 4px 14px;

    font-family: "Segoe Script", "Brush Script MT", cursive;
    font-size: clamp(26px, 4vw, 38px);
    font-weight: 500;
    font-style: italic;
    letter-spacing: 1px;

    color: #3559a8;
    text-shadow: 0 2px 12px rgba(71, 118, 230, 0.12);

    transition: color 0.3s ease,
                transform 0.3s ease;
}

.author::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 4px;
    width: 100%;
    height: 2px;

    background: linear-gradient(
        90deg,
        #4776e6,
        #a78bfa,
        transparent
    );

    border-radius: 50%;
    transform: rotate(-2deg);
    transform-origin: left;
    transition: transform 0.3s ease;
}

.author:hover {
    color: #8b5cf6;
    transform: translateY(-2px);
}

.author:hover::after {
    transform: rotate(0deg) scaleX(1.05);
}


/* ================= Nhập tên ở phong bì ================= */
.nameform {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  width: min(86vw, 360px);
  transition: opacity .5s ease, transform .5s ease;
}
.nameform.done {
  opacity: 0; transform: translateY(-6px); pointer-events: none; visibility: hidden;
  transition: opacity .5s ease, transform .5s ease, visibility 0s .5s;
}
.nameform label { color: var(--muted); font-size: 15px; font-weight: 500; text-align: center; }
.nf-row { display: flex; gap: 8px; width: 100%; }
.nf-row input {
  flex: 1; min-width: 0; padding: 12px 16px; border-radius: 999px;
  border: 1.5px solid var(--chip-line); background: var(--chip); color: var(--ink);
  font: inherit; font-size: 16px; text-align: center; outline: none;
}
.nf-row input::placeholder { color: var(--muted); opacity: .7; }
.nf-row input:focus { border-color: var(--rose); }
.nbtn {
  flex: none; border: 0; cursor: pointer; padding: 0 22px; border-radius: 999px;
  background: #c81f59; color: #fff; font-weight: 500; font-size: 16px;
  box-shadow: 0 8px 20px rgba(200, 31, 89, .3);
}
.shake { animation: shake .45s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

/* ================= Trang trò chơi ================= */
.gamepage { cursor: default; }
.gamepage .tp-title { font-size: calc(46px * var(--s) * var(--k, 1)); }
.game-body {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  opacity: 0; transform: translateY(8px);
}
.game-body > :first-child { margin-top: auto; }
.game-body > :last-child { margin-bottom: auto; }
.textpage.on .game-body { opacity: 1; transform: none; transition: opacity .7s ease 1.2s, transform .7s ease 1.2s; }
.g-q {
  margin: 0 0 calc(8px * var(--s)); font-size: calc(16px * var(--s) * var(--k, 1));
  font-weight: 500; line-height: 1.4; color: var(--pt);
}
.g-msg {
  margin: calc(6px * var(--s)) 0 0; min-height: calc(34px * var(--s) * var(--k, 1));
  font-size: calc(14px * var(--s) * var(--k, 1)); line-height: 1.4;
  text-align: center; color: #8d3a5d; font-weight: 500;
}
.g-btn {
  border: 0; cursor: pointer; border-radius: 999px; background: #c81f59; color: #fff; font-weight: 500;
  padding: calc(9px * var(--s) * var(--k, 1)) calc(22px * var(--s));
  font-size: calc(15px * var(--s) * var(--k, 1));
  box-shadow: 0 6px 16px rgba(200, 31, 89, .28); touch-action: manipulation;
}
.game-body .g-btn { align-self: center; }

/* Câu hỏi hoa */
.opts { display: flex; flex-direction: column; gap: calc(6px * var(--s) * var(--k, 1)); }
.opt {
  display: flex; align-items: center; gap: 10px; text-align: left;
  border: 1.5px solid rgba(200, 31, 89, .25); background: #fff; color: var(--pt);
  border-radius: 12px; padding: calc(7px * var(--s) * var(--k, 1)) 14px;
  font: inherit; font-size: calc(15.5px * var(--s) * var(--k, 1)); cursor: pointer; touch-action: manipulation;
  transition: opacity .3s, transform .35s cubic-bezier(.3, 1.4, .5, 1), background .3s;
}
.opt .ltr {
  flex: none; width: 1.6em; height: 1.6em; display: grid; place-items: center; border-radius: 50%;
  background: #fde4ec; color: #c81f59; font-style: normal; font-weight: 600; font-size: .85em;
}
.opt .e { font-size: 1.15em; }
.opt.wrong { opacity: .5; text-decoration: line-through; background: #fbe9ee; animation: shake .45s; }
.opt.real {
  opacity: 0; transform: scale(.9); pointer-events: none; font-weight: 600; color: #fff; border-color: transparent;
  background: linear-gradient(135deg, #ff7aa8, #c81f59);
}
.opt.real.show { opacity: 1; transform: none; pointer-events: auto; }
.opt.real.win { box-shadow: 0 0 0 4px rgba(255, 122, 168, .35); }
.opt .ar { font-style: normal; animation: nudgeR .9s ease-in-out infinite; }

  groups: [{ n: 11, make: (sc, init) => ({ x: rnd(0, sc.w), y: init ? rnd(0, sc.h) : sc.h + 24, vx: 0, vy: -rnd(14, 34), s: rnd(.025, .045) * sc.u + 4, sw: 10, sf: rnd(.6, 1.4), m: 60 }),

/* 13 Cầu vồng */
{ bg(ctx, sc, w, h) {
    vgrad(ctx, w, h, [[0, '#a9d6f5'], [.55, '#e3f1fb'], [1, '#fff3ee']]);

      draw: (ctx, p, sc) => { ctx.globalAlpha *= Math.max(.12, .6 - sc.age / 7); ctx.strokeStyle = '#8fb8e8'; ctx.lineWidth = 1.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-p.s * .12, p.s); ctx.stroke(); } },
    { n: 4, make: (sc, init) => { const s = rnd(sc.w * .13, sc.w * .22); return { x: init ? rnd(0, sc.w) : -s * 1.6, y: rnd(.05, .3) * sc.h, vx: 3 + s * .05, vy: 0, s, m: s * 2 }; },
      draw: (ctx, p) => { ctx.save(); ctx.translate(0, 4); cloud(ctx, p.s, 'rgba(140,180,225,.3)'); ctx.restore(); cloud(ctx, p.s, 'rgba(255,255,255,.96)'); } }],
  burstGroup: 0
},
/* 14 Vì sao */
{ init(sc) {
    const P = Array.from({ length: 10 }, (_, i) => { const t = i / 10 * TAU; return [Math.pow(Math.sin(t), 3) * 16, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]; });
    sc.d = { P, st: Array.from({ length: 46 }, () => ({ x: rnd(0, 1), y: rnd(0, .85), r: rnd(.6, 1.9), ph: rnd(0, TAU) })), next: 3, sh: null };

  bg(ctx, sc, w, h) {

    const cx = w * .5, cy = h * .44, sz = Math.min(w * .36, h * .33), k = sz / 16, P = sc.d.P;

  groups: [sparkGroup(10, '#ffe8a8', 4, 12)],
  burstGroup: 0,
  fg(ctx, sc, w, h) {

    hill(ctx, w, h, h * .93, h * .012, '#c9e8c2', 0, 1.3);
    for (const f of sc.d.fl) {
      const g = easeOut(clamp01((sc.age - f.d) / 1.4)), open = easeBack(clamp01((sc.age - f.d - .9) / 1.1));
      const bx = f.x * w, ty = h - h * f.hh * g, sway = Math.sin(sc.time + f.x * 6) * .04;
      ctx.strokeStyle = '#5fa56d'; ctx.lineWidth = Math.max(2.5, sc.u * .012); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(bx, h); ctx.quadraticCurveTo(bx, (h + ty) / 2, bx + sway * h * f.hh, ty); ctx.stroke();
      if (g > .4) { ctx.save(); ctx.translate(bx, h - (h - ty) * .5); ctx.rotate(1); ctx.translate(0, -sc.u * .03); leaf(ctx, sc.u * .045 * g, '#7fbf88'); ctx.restore(); }
      ctx.save(); ctx.translate(bx + sway * h * f.hh, ty); ctx.rotate(sway);

    }
  },
  groups: [{ n: 18, make: (sc, init) => ({ x: rnd(0, sc.w), y: init ? rnd(0, sc.h) : sc.h + 20, vx: 0, vy: -rnd(26, 60), s: rnd(7, 16), sw: 14, sf: rnd(.8, 1.8), c: pick(PINKS) }),
    draw: (ctx, p) => heart(ctx, p.s, p.c) }]

/* ---------- Scene engine ---------- */
class Scene {
  constructor(n, w, h, dpr) {
    this.n = n; this.cfg = SCENES[n - 1]; this.w = w; this.h = h; this.u = Math.min(w, h);
    this.canvas = document.createElement('canvas');
    this.canvas.width = Math.max(2, Math.round(w * dpr)); this.canvas.height = Math.max(2, Math.round(h * dpr));
    this.ctx = this.canvas.getContext('2d'); this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.time = 0; this.age = 0; this.dt = 0; this.active = false; this.parts = []; this.d = {};
    if (this.cfg.init) this.cfg.init(this);
    this.cfg.groups.forEach((g, gi) => { for (let k = 0; k < g.n; k++) this.parts.push(this.spawn(g, gi, true)); });
  }
  spawn(g, gi, init) {
    return Object.assign({ x: 0, y: 0, vx: 0, vy: 0, rot: 0, vr: 0, s: 8, t: rnd(0, 10), sw: 0, sf: 1, ph: rnd(0, TAU), g: gi }, g.make(this, init));
  }
  burst(x, y) {
    const gi = this.cfg.burstGroup || 0, g = this.cfg.groups[gi], L = g.burstLife || [1.6, 2.6];
    for (let k = 0; k < 14; k++) {
      const p = this.spawn(g, gi, false), a = rnd(0, TAU), sp = rnd(40, 140);
      p.x = x; p.y = y; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp - 30; p.sw = 0;
      if (p.ang !== undefined) p.ang = a;
      p.life = rnd(L[0], L[1]); p.temp = true; this.parts.push(p);
    }
  }
  tick(dt) {
    const { ctx, w, h, cfg } = this;
    this.dt = dt; this.time += dt; if (this.active) this.age += dt;
    cfg.bg(ctx, this, w, h);
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i], g = cfg.groups[p.g];
      p.t += dt; if (g.update) g.update(p, dt, this);
      p.x += (p.vx + (p.sw ? Math.cos(p.t * p.sf + p.ph) * p.sw : 0)) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.life !== undefined) { p.life -= dt; if (p.life <= 0) { this.parts.splice(i, 1); continue; } }
      const m = p.m !== undefined ? p.m : 80;
      if (p.x < -m || p.x > w + m || p.y < -m || p.y > h + m) {
        if (g.stay) continue;
        if (p.temp) { this.parts.splice(i, 1); continue; }
        Object.assign(p, { t: 0 }, g.make(this, false));
      }
    }
    for (const p of this.parts) {
      ctx.save(); ctx.translate(p.x, p.y); if (p.rot) ctx.rotate(p.rot);
      ctx.globalAlpha = p.life !== undefined ? Math.min(1, p.life * 1.2) : 1;
      cfg.groups[p.g].draw(ctx, p, this); ctx.restore();
    }
    if (cfg.fg) cfg.fg(ctx, this, w, h);
  }
}

/* ---------- Tim bay toàn sách (trang cuối) ---------- */
const fx = {
  cv: $('#fx'), ctx: null, p: [], acc: 0, w: 0, h: 0,
  resize() {
    const r = $('#stage').getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = r.width; this.h = r.height;
    this.cv.width = Math.max(2, Math.round(r.width * dpr)); this.cv.height = Math.max(2, Math.round(r.height * dpr));
    this.ctx = this.cv.getContext('2d'); this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },
  add(x, y, vx, vy, burst) {
    this.p.push({ x, y, vx, vy, s: rnd(9, 20), t: rnd(0, 6), sf: rnd(1, 2), sw: burst ? 0 : rnd(10, 24), ph: rnd(0, TAU), c: pick(PINKS), life: burst ? rnd(1.4, 2.4) : undefined, burst, rot: rnd(-.4, .4) });
  },
  burst(x, y) { for (let i = 0; i < 14; i++) { const a = rnd(0, TAU), sp = rnd(60, 190); this.add(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 60, true); } },
  tick(dt) {
    if (!this.ctx) return;
    const ctx = this.ctx; ctx.clearRect(0, 0, this.w, this.h);
    if (f >= N - 1) {
      this.acc += dt;
      const sr = $('#stage').getBoundingClientRect(), br = book.getBoundingClientRect();
      while (this.acc > .13) {
        this.acc -= .13;
        this.add(br.left - sr.left + rnd(0, br.width), br.bottom - sr.top - rnd(0, br.height * .3), rnd(-12, 12), -rnd(80, 150), false);
      }
    } else this.acc = 0;
    for (let i = this.p.length - 1; i >= 0; i--) {
      const p = this.p[i]; p.t += dt;
      if (p.burst) { const k = Math.pow(.35, dt); p.vx *= k; p.vy = p.vy * k - 20 * dt; }
      p.x += (p.vx + Math.cos(p.t * p.sf + p.ph) * p.sw) * dt; p.y += p.vy * dt;
      if (p.life !== undefined) { p.life -= dt; if (p.life <= 0) { this.p.splice(i, 1); continue; } }
      if (p.y < -30) { this.p.splice(i, 1); continue; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + Math.sin(p.t * p.sf) * .25);
      ctx.globalAlpha = .88 * clamp01(p.y / (this.h * .3)) * (p.life !== undefined ? Math.min(1, p.life) : 1);
      heart(ctx, p.s, p.c); ctx.restore();
    }
  }
};

/* ---------- Điều khiển sách ---------- */
const intro = $('#intro'), env = $('#env'), app = $('#app'), stage = $('#stage'), book = $('#book');
const prevBtn = $('#prev'), nextBtn = $('#next'), dotsEl = $('#dots'), labelEl = $('#label');
let f = 0, mode = 'spread', leaves = [], scenes = [], texts = [], goTimer = null, lastSize = '';

dotsEl.innerHTML = PAGES.map((P, i) => `<button class="dot${P.t === 'game' ? ' g' : ''}" type="button" aria-label="Trang ${i + 1}: ${pageLabel(P)}" data-n="${i + 1}"></button>`).join('');
const dotEls = [...dotsEl.children];

function coverHTML() {
  let petals = '';
  for (let i = 0; i < 8; i++) petals += `<ellipse cx="0" cy="-52" rx="22" ry="46" transform="rotate(${i * 45})"/>`;
  return `<svg class="cv-flower" viewBox="-100 -100 200 200" aria-hidden="true"><g fill="none" stroke="#f6d38a" stroke-width="1.2">${petals}<circle r="14"/><circle r="96"/></g></svg>
  <div class="cv-in"><p class="cv-small">20/10 · lời chúc và vài bất ngờ</p><h1 class="cv-title">9 lời chúc<br>20/10</h1><p class="cv-sub">Dành tặng ${esc(NAME || 'bạn')}, người phụ nữ tuyệt vời</p><p class="cv-hint">Chạm vào bìa để mở sách</p></div>`;
}

function makeScene(n, sceneNo, w, h, dpr) {
  const sc = new Scene(sceneNo, w, h, dpr); scenes[n] = sc; sc.canvas._sc = sc; return sc;
}

function buildPage(face, n, single, ph, pw, dpr) {
  const P = PAGES[n - 1], isWish = P.t === 'wish', isGame = P.t === 'game', isThanks = P.t === 'thanks';
  face.classList.add('textpage');
  if (isGame) face.classList.add('gamepage');
  if (isThanks) face.classList.add('thanks');
  if (isThanks || (isWish && P.w === WISHES.length - 1)) face.classList.add('final');
  if (single) {
    const sceneH = Math.round(ph * (isWish ? (ph < 520 ? .34 : .42) : .13));
    face.style.setProperty('--sh', sceneH + 'px');
    const wrap = el('div', 'sp-scene'); wrap.append(makeScene(n, P.sc, pw - 20, sceneH - 10, dpr).canvas); face.append(wrap);
  } else face.insertAdjacentHTML('beforeend', '<i class="frame"></i>');
  const inner = el('div', 'tp-in');
  const folio = `<span class="folio">${n} / ${N}</span>`;
  if (isWish) {
    const [t, sub, raw] = WISHES[P.w], body = fill(raw), promise = P.w === WISHES.length - 1;
    const pd = (1.55 + body.split(' ').length * .038 + .5).toFixed(2) + 's';
    inner.innerHTML = `<h2 class="tp-title"><span>${t}</span></h2><p class="tp-sub">${sub}</p><i class="tp-rule"></i>
      <p class="tp-body">${wordsHTML(body, 'w')}</p>
      ${promise ? `<p class="tp-promise" style="--pd:${pd}">${wordsHTML(fill(PROMISE), 'pw')}</p>` : ''}
      <div class="tp-foot">${folio}<span class="tp-hint">Chạm để lật trang</span></div>`;
  } else if (isGame) {
    const [t, sub] = GAME_META[P.g];
    inner.innerHTML = `<h2 class="tp-title"><span>${t}</span></h2><p class="tp-sub">${sub}</p><i class="tp-rule"></i>
      <div class="game-ui game-body">${gameHTML(P.g)}</div>
      <div class="tp-foot">${folio}<span class="tp-hint">Vuốt hoặc bấm mũi tên để sang trang</span></div>`;
  } else {
    const p2 = 'Cảm ơn vì đã kiên nhẫn bấm hết từng trang, và cảm ơn vì đã bấm “Có” (dù nút “Không” bạn cũng hông chọn được đâu haha😏).';
    const p3 = fill('Chúc {n} một ngày 20/10 thật vui, ăn ngon, chụp ảnh đẹp, và đừng quên nhận lời khen nhé.');
    const c2 = p2.split(' ').length, sd = (1.55 + (c2 + p3.split(' ').length) * .038 + .3).toFixed(2) + 's';
    inner.innerHTML = `<h2 class="tp-title"><span>Cảm ơn người đẹp nhé! 🌸</span></h2><i class="tp-rule"></i>
      <p class="tp-body">${wordsHTML(p2, 'w')}</p>
      <p class="tp-body">${wordsHTML(p3, 'w', c2)}</p>
      <p class="author sign" style="--sd:${sd}">— Nguyễn Anh Hào</p>
      <div class="tp-foot">${folio}<button class="restart" type="button">Đọc lại từ đầu</button></div>`;
  }
  face.append(inner); texts[n] = face;
  if (isGame) initGame(face, P.g);
}

function fit() {
  texts.forEach(face => {
    if (!face) return;
    const inner = face.querySelector('.tp-in'); let k = 1, guard = 0;
    face.style.setProperty('--k', 1);
    while (inner.scrollHeight > inner.clientHeight + 1 && k > .6 && guard++ < 16) { k -= .04; face.style.setProperty('--k', k.toFixed(2)); }
  });
}

function build() {
  clearTimeout(goTimer); G.meter.token++; if (G.meter.state === 'running') G.meter.state = 'idle';
  const st = stage.getBoundingClientRect();
  const availW = st.width - 24, availH = st.height - 18;
  let pw, ph;
  if (availW >= 720 && availH >= 380) { mode = 'spread'; ph = Math.min(availH, availW / (2 * .74), 700); pw = ph * .74; }
  else { mode = 'single'; ph = Math.min(availH, 640); pw = Math.min(availW, ph * .82, 480); }
  pw = Math.floor(pw); ph = Math.floor(ph);
  const s = Math.max(.74, Math.min(1.3, pw / 400)), dpr = Math.min(window.devicePixelRatio || 1, 2);
  book.className = 'book ' + mode + (f === 0 ? ' closed' : '') + ' notrans';
  book.style.setProperty('--pw', pw + 'px'); book.style.setProperty('--ph', ph + 'px'); book.style.setProperty('--s', s.toFixed(3));
  book.style.width = (mode === 'spread' ? pw * 2 : pw) + 'px'; book.style.height = ph + 'px';
  book.innerHTML = '<i class="board l"></i><i class="board r"></i>';
  scenes = []; leaves = []; texts = [];
  const sceneH = Math.round(ph * (ph < 520 ? .34 : .42));
  for (let i = 0; i <= N; i++) {
    const leafEl = el('div', 'leaf'), front = el('div', 'face front'), back = el('div', 'face back');
    leafEl.append(front, back);
    if (i === 0) { front.classList.add('cover'); front.innerHTML = coverHTML(); }
    else buildPage(front, i, mode === 'single', ph, pw, dpr);
    if (mode === 'spread' && i < N) { back.classList.add('scenepage'); back.append(makeScene(i + 1, PAGES[i].sc, pw, ph, dpr).canvas); }
    else back.classList.add('blank');
    book.append(leafEl); leaves.push(leafEl);
  }
  leaves.forEach((l, i) => { l.classList.toggle('flipped', i < f); l.style.zIndex = i < f ? i + 1 : N + 1 - i; });
  fit(); fx.resize(); setActive();
  void book.offsetWidth; book.classList.remove('notrans');
}

function setActive() {
  texts.forEach((t, n) => t && t.classList.toggle('on', n === f));
  scenes.forEach((sc, n) => { if (!sc) return; const was = sc.active; sc.active = n === f; if (sc.active && !was) sc.age = 0; });
  book.classList.toggle('closed', f === 0);
  prevBtn.disabled = f === 0; nextBtn.disabled = f === N;
  dotEls.forEach((d, i) => { d.classList.toggle('cur', i + 1 === f); d.classList.toggle('vis', i + 1 < f); });
  labelEl.textContent = f === 0 ? 'Chạm vào bìa để mở sách' : f < 3 ? `${f} / ${N} · Chạm vào tranh để thả hiệu ứng` : `${f} / ${N}`;
}

function flipLeaf(i, on) {
  const l = leaves[i]; if (!l) return;
  l.classList.add('turning'); l.style.zIndex = 60; l.classList.toggle('flipped', on);
  clearTimeout(l._t);
  l._t = setTimeout(() => { l.classList.remove('turning'); l.style.zIndex = on ? i + 1 : N + 1 - i; }, 1150);
}
function go(dir) {
  if (dir > 0 && f < N) { flipLeaf(f, true); f++; setActive(); }
  else if (dir < 0 && f > 0) { f--; flipLeaf(f, false); setActive(); }
}
function goTo(n) {
  clearTimeout(goTimer);
  const step = () => { if (f === n) return; const up = n > f; go(up ? 1 : -1); goTimer = setTimeout(step, up ? 170 : 90); };
  step();
}

const FORTUNES = [

  'Hôm nay ăn gì cũng không lên cân.',
  'Hôm nay bạn sẽ được khen xinh, nhớ nhận lời khen nhé.',
  'Tóc hôm nay tự vào nếp, không cần chỉnh.',
  'Ra đường có ánh sáng đẹp, chụp tấm nào cũng ưng.',
  'Da hôm nay sáng mịn, không có mụn nào dám mọc.',

  'Bài khó mấy cũng làm được, đoán đâu trúng đó.',
  'Tối nay ngủ một mạch tới sáng, không bị giật mình.',
  'Cuối tuần này sẽ có một buổi sáng được ngủ nướng thỏa thích.',
  'Có người đang nhắc tới bạn, không cần biết là ai.',
  'Tin nhắn bạn đang chờ sẽ tới sớm hơn bạn nghĩ.'
];

function burstAt(elm) {
  const sr = stage.getBoundingClientRect(), r = elm.getBoundingClientRect();
  fx.burst(r.left + r.width / 2 - sr.left, r.top + r.height / 2 - sr.top);
}

function gameHTML(id) {
  if (id === 'flower') {
    const L = 'ABCD', Fl = G.flower, showReal = Fl.done || Fl.wrong.length >= 4;
    return `<p class="g-q">Trong những loại hoa dưới đây, loài hoa nào đẹp nhất?</p>
      <div class="opts">${FLOWERS.map((f, i) => `<button type="button" class="opt${Fl.wrong.includes(i) ? ' wrong' : ''}" data-i="${i}"><i class="ltr">${L[i]}</i><span class="e">${f[0]}</span>${f[1]}</button>`).join('')}
        <button type="button" class="opt real${showReal ? ' show' : ''}${Fl.done ? ' win' : ''}" id="qReal"><i class="ar">➜</i> ${NAME ? 'Là bạn đó, ' + esc(NAME) + '!' : 'Là bạn đó!'} 💖</button></div>
      <p class="g-msg" id="qMsg"></p>`;
  }
  if (id === 'meter') {
    return `<p class="g-q">Chạm nút để đo độ xinh đẹp của ${esc(NAME || 'bạn')}</p>
      <div class="m-track" id="mTrack"><i class="m-bar" id="mBar"></i><b class="m-pct" id="mPct">0%</b></div>
      <p class="g-msg" id="mSt"></p>

  }
  if (id === 'age') {
    return `<p class="g-q">Bạn bao nhiêu tuổi nhỉ? Kéo thanh bên dưới nha</p>

      <input type="range" class="age-rng" id="aRng" min="1" max="60" step="1" value="${G.age.n ? 18 : 25}" aria-label="Tuổi">
      <p class="g-msg" id="aMsg"></p>`;
  }
  if (id === 'nope') {
    return `<p class="g-q">Bạn có thích mấy lời chúc này không?</p>
      <div class="nope-zone" id="nZone">
        <button type="button" class="g-btn yes" id="nYes">Có 💖</button>

          <rect x="54" y="58" width="12" height="54" fill="#ffd45e"/>
          <g class="lid">
            <rect x="14" y="40" width="92" height="22" rx="5" fill="#c81f59"/>
            <rect x="54" y="40" width="12" height="22" fill="#ffd45e"/>

function initGame(face, id) {
  const $$ = s => face.querySelector(s);
  const hint = $$('.tp-hint');
  const doneFn = { flower: () => G.flower.done, meter: () => G.meter.state === 'done', nope: () => G.nope.yes, fortune: () => G.fortune.last >= 0, age: () => G.age.n > 0 }[id];
  face._done = doneFn;
  const sync = () => { if (doneFn()) hint.textContent = 'Xong rồi, chạm để lật trang ➜'; };
  sync();

  if (id === 'flower') {
    const Fl = G.flower, msg = $$('#qMsg'), real = $$('#qReal');
    msg.textContent = Fl.msg || 'Chọn một đáp án nha 👇';
    face.querySelectorAll('.opt[data-i]').forEach(b => b.addEventListener('click', () => {
      if (Fl.done) return;
      const i = +b.dataset.i;
      if (!Fl.wrong.includes(i)) Fl.wrong.push(i);
      b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
      let m = txt(FLOWERS[i][2]);
      if (Fl.wrong.length >= 4) { m += ' Khoan, hình như còn một đáp án nữa!'; setTimeout(() => real.classList.add('show'), 600); }
      Fl.msg = m; msg.textContent = m;
    }));
    real.addEventListener('click', () => {
      if (!real.classList.contains('show')) return;
      Fl.done = true; real.classList.add('win');
      Fl.msg = txt('Đúng rồi! {N} đẹp nhất luôn, không cần bàn cãi 🌸'); msg.textContent = Fl.msg; sync();
      burstAt(real); setTimeout(() => burstAt(real), 250);
    });
  }

  if (id === 'meter') {
    const M = G.meter, track = $$('#mTrack'), bar = $$('#mBar'), pct = $$('#mPct'), st = $$('#mSt'), go = $$('#mGo');
    const set = (v, m) => { bar.style.width = v + '%'; pct.textContent = Math.round(v) + '%'; if (m !== undefined) st.textContent = m; };
    const done = anim => {
      M.state = 'done'; sync(); track.classList.add('over'); bar.style.width = '100%'; pct.textContent = 'ERROR';
      st.textContent = txt('⚠️ Vượt giới hạn đo! {N} xinh quá nên máy quá tải rồi 💥');
      go.textContent = 'Đo lại cho chắc 😏'; go.style.visibility = 'visible';
      if (anim) { burstAt(track); setTimeout(() => burstAt(track), 300); }
    };
    if (M.state === 'done') done(false); else st.textContent = 'Chạm nút để bắt đầu đo';
    go.addEventListener('click', () => {
      if (M.state === 'running') return;
      M.state = 'running'; const tk = ++M.token;
      track.classList.remove('over'); go.style.visibility = 'hidden'; set(0, 'Đang quét nhan sắc…');
      const steps = [[0, 50, 1200, 'Đang quét nhan sắc…'], [50, 50, 300], [50, 80, 1200, 'Đang tính điểm duyên dáng…'], [80, 80, 300],
        [80, 99, 1000, 'Đang đo độ dễ thương…'], [99, 99, 1600, '99%… sao đứng yên vậy ta? 🤨']];
      let i = 0;
      const next = () => {
        if (M.token !== tk) return;
        if (i >= steps.length) { done(true); return; }
        const [a, b, d, m] = steps[i++], t0 = performance.now();
        if (m) st.textContent = m;
        const tick = now => {
          if (M.token !== tk) return;
          const k = Math.min(1, (now - t0) / d);
          set(a + (b - a) * (k * (2 - k)));
          if (k < 1) requestAnimationFrame(tick); else next();
        };
        requestAnimationFrame(tick);
      };
      next();
    });
  }

  if (id === 'nope') {
    const S = G.nope, zone = $$('#nZone'), yes = $$('#nYes'), no = $$('#nNo'), msg = $$('#nMsg');
    let lastFlee = 0;
    const apply = () => {
      const c = Math.min(S.n, 5);
      yes.style.setProperty('--ys', S.yes ? 1.5 : (1 + c * .12).toFixed(2));
      if (S.yes || S.n >= 5) no.classList.add('gone'); else no.style.setProperty('--ns', (1 - c * .16).toFixed(2));
    };
    msg.textContent = S.msg || 'Chọn đi nào 👇';
    apply();
    const flee = e => {
      const now = performance.now();
      if (S.yes || S.n >= 5 || now - lastFlee < 300) return;
      lastFlee = now; S.n++;
      const zr = zone.getBoundingClientRect(), nr = no.getBoundingClientRect(), yr = yes.getBoundingClientRect();
      const px = e && e.detail !== 0 && e.clientX !== undefined ? e.clientX : null, py = px === null ? null : e.clientY;
      let best = null;
      for (let t = 0; t < 14; t++) {
        const cx = nr.width / 2 + Math.random() * Math.max(0, zr.width - nr.width), cy = nr.height / 2 + Math.random() * Math.max(0, zr.height - nr.height);
        const gx = zr.left + cx, gy = zr.top + cy;
        const far = px === null || Math.hypot(gx - px, gy - py) > 90;
        const hit = gx + nr.width / 2 > yr.left - 8 && gx - nr.width / 2 < yr.right + 8 && gy + nr.height / 2 > yr.top - 8 && gy - nr.height / 2 < yr.bottom + 8;
        best = { cx, cy }; if (far && !hit) break;
      }
      no.style.left = best.cx + 'px'; no.style.top = best.cy + 'px';
      S.msg = txt(NOPE_TEASE[S.n - 1]); msg.textContent = S.msg; apply();
    };
    no.addEventListener('pointerdown', e => { e.preventDefault(); flee(e); });
    no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') flee(e); });
    no.addEventListener('click', e => { e.preventDefault(); flee(e); });
    yes.addEventListener('click', () => {
      S.yes = true; S.msg = 'Tôi biết mà 😎'; msg.textContent = S.msg; apply(); sync();
      burstAt(yes); setTimeout(() => burstAt(yes), 250);
    });
  }

  if (id === 'age') {
    const A = G.age, rng = $$('#aRng'), num = $$('#aNum'), msg = $$('#aMsg');
    let timer = 0, raf = 0;
    msg.textContent = A.msg || 'Kéo thử xem nào 👇';
    const finish = () => {
      rng.value = 18; num.textContent = 18; A.n++; sync();
      A.msg = txt(AGE_TEASE[Math.min(A.n - 1, AGE_TEASE.length - 1)]); msg.textContent = A.msg;
      num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop'); burstAt(num);
    };
    const snap = () => {
      cancelAnimationFrame(raf);
      const from = +rng.value, t0 = performance.now(), d = 450;
      const step = now => {
        const k = Math.min(1, (now - t0) / d), v = from + (18 - from) * (1 - Math.pow(1 - k, 3));
        rng.value = v; num.textContent = rng.value;
        if (k < 1) raf = requestAnimationFrame(step); else finish();
      };
      raf = requestAnimationFrame(step);
    };
    rng.addEventListener('input', () => { cancelAnimationFrame(raf); num.textContent = rng.value; clearTimeout(timer); timer = setTimeout(snap, 500); });
    rng.addEventListener('change', () => { clearTimeout(timer); timer = setTimeout(snap, 150); });
  }

  if (id === 'fortune') {
    const F = G.fortune, gift = $$('#fGift'), card = $$('#fCard'), text = $$('#fText'), msg = $$('#fMsg'), again = $$('#fAgain');
    let busy = false;
    $$('#fHead').textContent = txt('Quẻ của {n} hôm nay');
    const showCard = i => { text.textContent = FORTUNES[i]; card.classList.remove('show'); void card.offsetWidth; card.classList.add('show'); };
    const after = () => { sync(); again.style.visibility = 'visible'; msg.textContent = 'Muốn quẻ khác thì bốc tiếp nha 👇'; };
    if (F.last >= 0) { gift.classList.add('open', 'away'); text.textContent = FORTUNES[F.last]; card.classList.add('show'); after(); }
    else msg.textContent = 'Chạm vào hộp quà để bốc quẻ 🎁';
    const draw = () => {
      if (busy) return; busy = true;
      let i; do { i = Math.floor(Math.random() * FORTUNES.length); } while (i === F.last);
      F.last = i;
      if (!gift.classList.contains('away')) {
        gift.classList.add('shake');
        setTimeout(() => { gift.classList.remove('shake'); gift.classList.add('open'); burstAt(gift); }, 650);
        setTimeout(() => { gift.classList.add('away'); showCard(i); after(); busy = false; }, 1050);
      } else { showCard(i); burstAt(card); busy = false; }
    };
    gift.addEventListener('click', draw); again.addEventListener('click', draw);
  }
}

/* ---------- Sự kiện ---------- */
let swiped = false, noSwipe = false, sx = 0, sy = 0;
stage.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; noSwipe = !!e.target.closest('input[type=range]'); });
stage.addEventListener('pointerup', e => {
  if (noSwipe) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) { go(dx < 0 ? 1 : -1); swiped = true; setTimeout(() => { swiped = false; }, 80); }
});
stage.addEventListener('click', e => {
  if (swiped) return;
  const sr = stage.getBoundingClientRect();
  const cv = e.target.closest('canvas');
  if (cv && cv._sc) {
    const sc = cv._sc, r = cv.getBoundingClientRect();
    sc.burst((e.clientX - r.left) * (sc.w / r.width), (e.clientY - r.top) * (sc.h / r.height));
    if (f >= N - 1) fx.burst(e.clientX - sr.left, e.clientY - sr.top);
    return;
  }
  if (e.target.closest('.restart')) { goTo(0); return; }
  const gp = e.target.closest('.gamepage');
  if (gp) { if (gp._done && gp._done() && !e.target.closest('button, input')) go(1); return; }
  const face = e.target.closest('.face');
  if (face && (face.classList.contains('cover') || face.classList.contains('textpage'))) {
    if (f === N) fx.burst(e.clientX - sr.left, e.clientY - sr.top); else go(1);
  }
});
prevBtn.addEventListener('click', () => go(-1));
nextBtn.addEventListener('click', () => go(1));
dotsEl.addEventListener('click', e => { const d = e.target.closest('.dot'); if (d) goTo(+d.dataset.n); });
document.addEventListener('keydown', e => {
  if (!app.classList.contains('show')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
});

/* ---------- Phong bì & nhập tên ---------- */
const nameForm = $('#nameForm'), nameIn = $('#nameIn'), nameRow = $('#nfRow'), nameLabel = $('#nfLabel');
let opened = false, named = false;
function submitName() {
  if (named) return; named = true;
  NAME = cleanName(nameIn.value);
  $('#lt1').innerHTML = wordsHTML(`Gửi ${esc(NAME || 'bạn')}, người phụ nữ tuyệt vời…`, 'lw');
  $('#lt2').textContent = `9 lời chúc và vài trò vui đang chờ ${NAME || 'bạn'} bên trong.`;
  nameIn.blur(); nameForm.classList.add('done'); env.classList.remove('locked');
  $('#hint').classList.remove('gone'); env.setAttribute('aria-label', 'Chạm để mở phong bì');
  build();
}
function openEnv() {
  if (!named) {
    nameLabel.textContent = 'Nhập tên trước đã nè 😏';
    nameRow.classList.remove('shake'); void nameRow.offsetWidth; nameRow.classList.add('shake'); nameIn.focus();
    return;
  }
  if (opened) return; opened = true;
  env.classList.add('open'); $('#hint').classList.add('gone'); env.setAttribute('aria-label', 'Phong bì đã mở');
  setTimeout(() => $('#cta').classList.add('show'), reduce ? 200 : 3700);
}
$('#nameBtn').addEventListener('click', submitName);
nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitName(); } });
env.addEventListener('click', openEnv);
env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnv(); } });
$('#cta').addEventListener('click', () => {
  intro.classList.add('leave'); app.classList.add('show');
  setTimeout(() => { intro.style.display = 'none'; }, 1000);
});

/* ---------- Vòng lặp & resize ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000) * speed; last = now;
  if (app.classList.contains('show')) {
    for (let n = Math.max(1, f - 1); n <= Math.min(N, f + 1); n++) { const sc = scenes[n]; if (sc) sc.tick(dt); }
    fx.tick(dt);
  }
  requestAnimationFrame(frame);
}
let rt;
function onResize() {
  clearTimeout(rt);
  rt = setTimeout(() => {
    const r = stage.getBoundingClientRect(), key = Math.round(r.width / 4) + 'x' + Math.round(r.height / 4);
    if (key !== lastSize) { lastSize = key; build(); }
  }, 200);
}
window.addEventListener('resize', onResize);
build();
lastSize = Math.round(stage.getBoundingClientRect().width / 4) + 'x' + Math.round(stage.getBoundingClientRect().height / 4);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); });
requestAnimationFrame(frame);
})();
</script>
